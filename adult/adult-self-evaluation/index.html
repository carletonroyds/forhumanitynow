  <body style="background-color:#F6F2EA;">
    <div id="root"></div>
    <nav class="ase-tabs" role="tablist" aria-label="Results sections">
      <button type="button" role="tab" data-tab="summary" aria-selected="true">Summary</button>
      <button type="button" role="tab" data-tab="map" aria-selected="false">Map</button>
      <button type="button" role="tab" data-tab="about" aria-selected="false">About</button>
    </nav>
    <script>
      // Phone only: the results screen is shown one tab at a time (styles above).
      (() => {
        const html = document.documentElement;
        const tabs = [...document.querySelectorAll(".ase-tabs button")];
        const setTab = t => {
          html.dataset.mtab = t;
          tabs.forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
          window.scrollTo({ top: 0 });
        };
        tabs.forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
        const check = () => {
          let on = false;
          try { on = !!document.querySelector("#root .animate-rise:has(> div > h3.italic)"); } catch (e) { on = false; }
          if (on && html.dataset.aseResults !== "1") { html.dataset.aseResults = "1"; setTab("summary"); }
          else if (!on && html.dataset.aseResults === "1") { html.dataset.aseResults = ""; }
        };
        new MutationObserver(check).observe(document.getElementById("root"), { childList: true, subtree: true });
      })();
    </script>
  </body>
