<html lang="en">
<head>
<meta charset="utf-8">

<title>10 Social Media Antidotes</title>

<style>
  :root {
    color-scheme: light;
    --ink:#1d1c1a; --accent:#c93c32; --paper:#f4efe5;
    --gap: clamp(.6rem, 2.2vh, 1.4rem);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    -webkit-text-size-adjust: 100%;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: #24211d; overflow: hidden;
    background: radial-gradient(circle at 15% 0%, rgb(201 60 50 / 8%), transparent 32rem), var(--paper);
  }
  button { font: inherit; }
  ::selection { background:#f8b4aa; color: var(--ink); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* Fill the iframe exactly: header and nav pinned, card flexes between them. */
  .shell {
    height: 100svh; height: 100dvh;
    display: flex; flex-direction: column; gap: var(--gap);
    max-width: 64rem; margin: 0 auto;
    padding: clamp(.7rem, 2.2vh, 2.25rem) clamp(.7rem, 3vw, 1.5rem);
  }
  header, footer { flex: 0 0 auto; }
  /* Card is anchored under the heading and grows downward as sections reveal. */
  main { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; }

  .eyebrow {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding-bottom: clamp(.4rem, 1.2vh, .9rem);
    border-bottom: 1px solid rgb(29 28 26 / 15%);
  }
  .eyebrow p { margin: 0; font-size: clamp(.6rem, 1.6vw, .75rem); }
  .lab { font-weight: 800; text-transform: uppercase; letter-spacing: .2em; color: var(--accent); }
  .kicker { font-weight: 600; color: #5d5750; }

  .masthead { display: grid; gap: .5rem; margin-top: clamp(.5rem, 1.6vh, 1.25rem); }
  h1 {
    margin: 0; font-weight: 900; color: var(--ink);
    font-size: clamp(1.4rem, min(5.2vw + .3rem, 7.5vh), 4.25rem);
    line-height: .95; letter-spacing: -.04em;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .standfirst {
    margin: 0; font-weight: 500; color: #625c54;
    font-size: clamp(.78rem, 1.6vw + .3rem, 1rem); line-height: 1.5;
  }

  /* Card: header fixed, body scrolls internally only if the iframe is very short. */
  .card {
    width: 100%; display: flex; flex-direction: column; min-height: 0;
    flex: 0 1 auto; max-height: 100%;
    overflow: hidden; border-radius: clamp(1rem, 2.4vw, 1.75rem);
    border: 1px solid rgb(29 28 26 / 15%); background: #fff;
    box-shadow: 0 18px 60px rgb(52 43 32 / 14%);
  }
  .card-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: clamp(.75rem, 2.5vw, 1.5rem);
    background: var(--ink); color: #fff; padding: clamp(.8rem, 2.4vh, 2.25rem) clamp(.9rem, 3vw, 2.25rem);
  }
  .card-head > div { min-width: 0; }
  .pattern-no {
    margin: 0 0 .3rem; font-weight: 900; text-transform: uppercase;
    letter-spacing: .2em; color: #ef6c5f; font-size: clamp(.58rem, 1.5vw, .75rem);
  }
  .card-head h2 {
    margin: 0; font-weight: 900; line-height: 1.1; letter-spacing: -.025em;
    font-size: clamp(1.05rem, min(3.6vw + .2rem, 5.5vh), 3rem);
    overflow-wrap: break-word;
  }
  .card-head img {
    flex: 0 0 auto; object-fit: cover; border-radius: clamp(.6rem, 1.6vw, 1rem);
    border: 2px solid rgb(255 255 255 / 15%); box-shadow: 0 10px 15px rgb(0 0 0 / 25%);
    width: clamp(2.75rem, min(11vw, 13vh), 10rem); height: clamp(2.75rem, min(11vw, 13vh), 10rem);
  }

  .card-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .row {
    display: grid; gap: .2rem;
    padding: clamp(.6rem, 1.9vh, 2rem) clamp(.9rem, 3vw, 2rem);
  }
  .row h3 {
    margin: 0; font-weight: 900; text-transform: uppercase;
    letter-spacing: .16em; color: #736b61; font-size: clamp(.56rem, 1.5vw, .75rem);
  }
  .row p { margin: 0; line-height: 1.3; font-size: clamp(.9rem, min(2.1vw + .35rem, 3.4vh), 1.5rem); overflow-wrap: break-word; }
  .row-trigger { background:#e6ded1; }  .row-trigger p { font-weight:700; color:#2b2824; }
  .row-effect { background:#f7f3ed; }   .row-effect p { font-weight:600; color:#38332e; }
  .row-antidote { background:#f8d6cf; } .row-antidote h3 { color:#a82f29; }
  .row-antidote p { font-weight:800; color:#3a211f; }

  /* Height is animated from JS using the inner block's measured height.
     The 0fr->1fr grid trick is not used: it needs a resolvable height context,
     which a top-anchored card inside a scrollable flex parent does not give it. */
  .reveal { height: 0; overflow: hidden; transition: height .7s ease-in-out; }

  .prompt {
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
    background: #fff; padding: clamp(.5rem, 1.4vh, .9rem) clamp(.9rem, 3vw, 1.75rem);
    border-top: 1px solid rgb(29 28 26 / 10%);
  }
  .prompt[hidden] { display: none; }
  .prompt p { margin: 0; font-size: clamp(.68rem, 1.6vw, .875rem); font-weight: 600; color: #777067; }
  .reveal-now {
    flex-shrink: 0; border-radius: 9999px; background: none; cursor: pointer;
    border: 1px solid rgb(29 28 26 / 20%); padding: .45rem .9rem;
    font-size: clamp(.7rem, 1.6vw, .875rem); font-weight: 800; color: #2b2824;
    transition: color .2s, border-color .2s;
  }
  .reveal-now:hover { border-color: var(--accent); color: var(--accent); }

  .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .6rem; }
  .step {
    display: inline-flex; min-height: 2.9rem; align-items: center; justify-content: center;
    gap: .45rem; border: 0; border-radius: 9999px; background: var(--ink); color: #fff;
    padding: .6rem clamp(.7rem, 2.5vw, 1.5rem); cursor: pointer;
    font-size: clamp(.8rem, 1.7vw, 1rem); font-weight: 800;
    box-shadow: 0 5px 0 #a9a197; transition: transform .2s, background-color .2s;
    touch-action: manipulation;
  }
  .step:hover:not(:disabled) { transform: translateY(-2px); background: var(--accent); }
  .step:disabled { transform: none; cursor: not-allowed; opacity: .35; }
  .step svg { height: 1.15rem; width: 1.15rem; flex: 0 0 auto; }

  .counter { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
  .counter span { font-size: clamp(.72rem, 1.7vw, .875rem); font-weight: 900; font-variant-numeric: tabular-nums; color: #35312d; }
  .track { height: .35rem; width: clamp(3rem, 12vw, 6rem); overflow: hidden; border-radius: 9999px; background: #d4cdc2; }
  .track > div { height: 100%; border-radius: 9999px; background: var(--accent); transition: width .3s; }

  .tip { margin: .55rem 0 0; text-align: center; font-size: .72rem; font-weight: 600; color: #777067; }

  /* Wide enough for two columns inside each row */
  @media (min-width: 40rem) {
    .row { grid-template-columns: 11rem 1fr; align-items: start; gap: .75rem; }
    .masthead { grid-template-columns: 1fr auto; align-items: end; }
    .standfirst { text-align: right; max-width: 18rem; }
  }
  /* Narrow: drop the non-essential bits rather than let them squeeze the card */
  @media (max-width: 26rem) {
    .kicker, .tip { display: none; }
  }
  /* Short iframe: shed chrome so the card keeps as much room as possible */
  @media (max-height: 40rem) {
    .standfirst, .tip { display: none; }
    .masthead { margin-top: .3rem; }
    .eyebrow { border-bottom: 0; padding-bottom: 0; }
  }
  /* Coarse pointers get no hover lift, and the key tip is meaningless */
  @media (hover: none) {
    .step:hover:not(:disabled) { transform: none; background: var(--ink); }
    .tip { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important; animation-duration: .01ms !important;
      animation-iteration-count: 1 !important; scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="eyebrow">
      <p class="lab">Attention Lab</p>
      <p class="kicker">A critical-thinking field guide</p>
    </div>
    <div class="masthead">
      <h1>10 Social Media <em>Antidotes</em></h1>
      <p class="standfirst">Notice the hijack. Name the effect. Choose your response.</p>
    </div>
  </header>

  <main aria-live="polite">
    <article class="card">
      <div class="card-head">
        <div>
          <p class="pattern-no" id="pattern-no"></p>
          <h2 id="pattern-name"></h2>
        </div>
        <img id="pattern-image" alt="" width="200" height="200" decoding="async">
      </div>
      <div class="card-body">
        <section class="row row-trigger">
          <h3>The trigger</h3>
          <p id="pattern-trigger"></p>
        </section>
        <div class="reveal" id="reveal-effect" aria-hidden="true"><div>
          <section class="row row-effect">
            <h3>What it does</h3>
            <p id="pattern-effect"></p>
          </section>
        </div></div>
        <div class="reveal" id="reveal-antidote" aria-hidden="true"><div>
          <section class="row row-antidote">
            <h3>Your antidote</h3>
            <p id="pattern-antidote"></p>
          </section>
        </div></div>
        <div class="prompt" id="prompt">
          <p id="prompt-text"></p>
          <button type="button" class="reveal-now" id="reveal-now">Reveal now</button>
        </div>
      </div>
    </article>
  </main>

  <footer>
    <div class="nav">
      <button type="button" class="step" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
        <span>Prev</span>
      </button>
      <div class="counter" id="counter">
        <span id="counter-text"></span>
        <div class="track"><div id="track-fill"></div></div>
      </div>
      <button type="button" class="step" id="next" aria-label="Next">
        <span>Next</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
      </button>
    </div>
    <p class="tip">Tip: use the left and right arrow keys to move through the guide.</p>
  </footer>
</div>

  var TOTAL = MECHANISMS.length;
  var el = function (id) { return document.getElementById(id); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var index = 0, stage = 1, timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  // Open/close by animating to the inner block's measured height, then
  // releasing to auto so rewrapping text (resize, rotate) can never clip.
  function setOpen(box, open) {
    var inner = box.firstElementChild;
    box.setAttribute('aria-hidden', String(!open));
    clearTimeout(box._release);
    if (open) {
      if (box.dataset.state === 'open') return;
      box.dataset.state = 'open';
      box.style.height = inner.offsetHeight + 'px';
      box._release = setTimeout(function () {
        if (box.dataset.state === 'open') box.style.height = 'auto';
      }, 750);
    } else {
      box.dataset.state = 'closed';
      box.style.height = '0px';
    }
  }

  function paint() {
    setOpen(el('reveal-effect'), stage >= 2);
    setOpen(el('reveal-antidote'), stage >= 3);
    el('prompt').hidden = stage >= 3;
    el('prompt-text').textContent = stage === 1 ? 'The effect appears next.' : 'The antidote appears next.';
  }

  function revealAll() { clearTimers(); stage = 3; paint(); }

  function render() {
    var m = MECHANISMS[index];
    el('pattern-no').textContent = 'Pattern ' + String(m.id).padStart(2, '0');
    el('pattern-name').textContent = m.name;
    el('pattern-image').src = m.image;
    el('pattern-image').alt = 'Illustration representing ' + m.name;
    el('pattern-trigger').textContent = m.trigger;
    el('pattern-effect').textContent = m.effect;
    el('pattern-antidote').textContent = m.antidote;

    el('prev').disabled = index === 0;
    el('next').disabled = index === TOTAL - 1;
    el('counter-text').textContent = String(index + 1).padStart(2, '0') + ' / ' + String(TOTAL).padStart(2, '0');
    el('counter').setAttribute('aria-label', 'Card ' + (index + 1) + ' of ' + TOTAL);
    el('track-fill').style.width = ((index + 1) / TOTAL) * 100 + '%';
    el('pattern-image').closest('.card').querySelector('.card-body').scrollTop = 0;

    clearTimers();
    if (reduced) { stage = 3; paint(); return; }
    stage = 1; paint();
    timers.push(setTimeout(function () { stage = 2; paint(); }, 3000));
    timers.push(setTimeout(function () { stage = 3; paint(); }, 6000));
  }

  function go(d) {
    var t = Math.min(Math.max(index + d, 0), TOTAL - 1);
    if (t === index) return;
    index = t; render();
  }

  el('prev').addEventListener('click', function () { go(-1); });
  el('next').addEventListener('click', function () { go(1); });
  el('reveal-now').addEventListener('click', revealAll);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  });

  // Swipe, since this is embedded and phone users will try it.
  var x0 = null, y0 = null;
  document.addEventListener('touchstart', function (e) {
    x0 = e.changedTouches[0].clientX; y0 = e.changedTouches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1);
    x0 = y0 = null;
  }, { passive: true });

  window.addEventListener('resize', function () {
    [el('reveal-effect'), el('reveal-antidote')].forEach(function (box) {
      if (box.dataset.state === 'open') box.style.height = 'auto';
    });
  });

  render();
})();
</script>
</body>
</html>
